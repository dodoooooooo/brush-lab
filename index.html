const supported={spacing:[0,100],spacingJitter:[0,100],lateral:[0,100],linear:[0,100],falloff:[0,100],streamline:[0,100],scatter:[0,100],count:[1,8],countJitter:[0,100],speedSize:[-100,100],speedOpacity:[-100,100],speedSpacing:[-100,100],sizeJitter:[0,100],opacityJitter:[0,100]};
const defaults={spacing:17,spacingJitter:0,lateral:0,linear:0,falloff:0,streamline:0,scatter:0,count:1,countJitter:0,speedSize:0,speedOpacity:0,speedSpacing:0,sizeJitter:0,opacityJitter:0};

const presets=[['鉛筆','Pencil','✎',{spacing:9,spacingJitter:3,scatter:5,sizeJitter:8,opacityJitter:10}],['墨線筆','Inking','〰',{spacing:2,spacingJitter:0,scatter:0,sizeJitter:0,opacityJitter:0}],['噴槍','Airbrush','◌',{spacing:3,scatter:0,opacityJitter:18}],['水彩','Watercolor','◍',{spacing:8,scatter:12,opacityJitter:22}],['粉彩','Pastel','✳',{spacing:12,spacingJitter:12,scatter:25,sizeJitter:15}],['裝飾印章','Stamp','✿',{spacing:80,scatter:20,count:1}]];

const $=id=>document.getElementById(id);let lang='zh',category=0,opened=-1,settings={...defaults},color='#567e66',size=18,strokes=[],undone=[],current=null;const canvas=$('canvas'),ctx=canvas.getContext('2d');let dpr=1;
function txt(a,b){return lang==='zh'?a:b}function drawCategories(){const box=$('categories');box.replaceChildren();names.forEach((n,i)=>{const b=document.createElement('button');b.className='category'+(i===category?' active':'');b.innerHTML='<span></span><span class="count">'+groups[i].length+'</span>';b.firstElementChild.textContent=n[lang==='zh'?0:1];b.onclick=()=>{category=i;opened=-1;$('search').value='';drawCategories();drawItems();$('sidebar').classList.remove('show');$('menuSwitch').checked=false};box.append(b)})}
function drawItems(){const list=$('items');list.replaceChildren();$('sectionTitle').textContent=names[category][lang==='zh'?0:1];$('sectionEn').textContent=names[category][1].toUpperCase();$('sectionDesc').textContent=txt('點選設定查看說明；可操作項目附有滑桿','Tap a setting for details; adjustable items have sliders');let query=$('search').value.trim().toLowerCase();let found=0;groups[category].forEach((a,i)=>{if(query&&!a.slice(0,4).filter(Boolean).join(' ').toLowerCase().includes(query))return;found++;const item=document.createElement('div');item.className='item'+(opened===i?' open':'');const btn=document.createElement('button');btn.className='itembtn';const left=document.createElement('span'),label=document.createElement('strong'),sub=document.createElement('small');label.textContent=txt(a[0],a[1]||a[0]);sub.textContent=txt(a[1]||'英文名稱待確認',a[0]);left.append(label,sub);const arrow=document.createElement('span');arrow.className='chev';arrow.textContent='›';btn.append(left,arrow);btn.onclick=()=>{opened=opened===i?-1:i;drawItems()};item.append(btn);if(opened===i){const body=document.createElement('div');body.className='itembody';const p=document.createElement('p');p.textContent=txt(a[2],a[3]);body.append(p);const key=a[4];if(key&&supported[key]){const [min,max]=supported[key],line=document.createElement('div'),v=document.createElement('strong'),r=document.createElement('input');line.className='sliderline';const span=document.createElement('span');span.textContent=txt('調整數值','Value');v.textContent=settings[key]+(key==='count'?'':'%');line.append(span,v);r.type='range';r.min=min;r.max=max;r.value=settings[key];r.oninput=()=>{settings[key]=Number(r.value);v.textContent=r.value+(key==='count'?'':'%');$('activeSetting').textContent=a[0]+' · '+v.textContent;save()};body.append(line,r);const note=document.createElement('div');note.className='hint';note.textContent=txt('✓ 此項目會影響之後繪製的筆觸','✓ This affects new strokes');body.append(note)}else{const note=document.createElement('div');note.className='hint';note.textContent=txt('此項目目前提供說明，尚未模擬效果。','Explanation only; simulation not yet implemented.');body.append(note)}item.append(body)}list.append(item)});if(!found){const p=document.createElement('p');p.className='empty';p.textContent=txt('沒有符合的參數','No matching settings');list.append(p)}}
function searchAll(){let q=$('search').value.trim().toLowerCase();if(q){const ix=groups.findIndex(g=>g.some(a=>a.slice(0,4).filter(Boolean).join(' ').toLowerCase().includes(q)));if(ix>=0)category=ix}opened=-1;drawCategories();drawItems()}
function save(){try{localStorage.setItem('brushlab-side-v1',JSON.stringify({settings,color,size,lang,dark:document.body.classList.contains('dark')}))}catch{}}try{let s=JSON.parse(localStorage.getItem('brushlab-side-v1')||'{}');settings={...defaults,...s.settings};color=s.color||color;size=s.size||size;lang=s.lang==='en'?'en':'zh';if(s.dark)document.body.classList.add('dark')}catch{}
function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure||.5,t:performance.now()}}
function stamp(x,y,sz,opacity,s,random){ctx.save();ctx.globalAlpha=Math.max(.03,Math.min(1,opacity));ctx.fillStyle=s.color;ctx.translate(x,y);ctx.rotate((random()-.5)*s.settings.scatter/100*Math.PI*2);ctx.beginPath();ctx.ellipse(0,0,Math.max(0.5,sz/2),Math.max(0.5,sz/2),0,0,Math.PI*2);ctx.fill();ctx.restore()}
function randomizer(seed){return()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}}
function stroke(s){const pts=s.points,random=randomizer(s.seed),cfg=s.settings;if(!pts.length)return;let step=Math.max(1.5,s.size*(.08+cfg.spacing/100*.95)),distance=0,idx=0;const mark=(x,y,p,speed)=>{let count=Math.max(1,Math.round(cfg.count*(1-random()*cfg.countJitter/100)));for(let k=0;k<count;k++){let sz=s.size*(.75+p*.5)*(1+(random()-.5)*cfg.sizeJitter/100*1.7);sz*=Math.max(.15,1+cfg.speedSize/100*Math.min(1,speed));let opacity=(1-random()*cfg.opacityJitter/100)*Math.max(.1,1+cfg.speedOpacity/100*Math.min(1,speed));opacity*=Math.max(0,1-idx*cfg.falloff/5000);stamp(x,y,sz,opacity,s,random);idx++}};mark(pts[0].x,pts[0].y,pts[0].p,0);for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.01)continue;let angle=Math.atan2(dy,dx),speed=len/Math.max(1,b.t-a.t);distance+=len;for(let at=step;at<=len;at+=Math.max(1.5,step*(1+(random()-.5)*cfg.spacingJitter/100))){let t=at/len,x=a.x+dx*t,y=a.y+dy*t;x+=(random()-.5)*s.size*cfg.lateral/100*2;y+=(random()-.5)*s.size*cfg.lateral/100*2;let offset=(random()-.5)*s.size*cfg.linear/100;x+=Math.cos(angle)*offset;y+=Math.sin(angle)*offset;mark(x,y,a.p+(b.p-a.p)*t,speed)}}}
function repaint(){let w=canvas.width/dpr,h=canvas.height/dpr;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fffdf9';ctx.fillRect(0,0,w,h);strokes.forEach(stroke);if(current)stroke(current)}function resize(){const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);repaint()}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;canvas.setPointerCapture(e.pointerId);current={points:[point(e)],settings:{...settings},size,color,seed:Math.floor(Math.random()*4294967295)};repaint()});canvas.addEventListener('pointermove',e=>{if(!current)return;current.points.push(point(e));repaint()});function finish(){if(!current)return;strokes.push(current);current=null;undone=[];repaint()}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
$('undo').onclick=()=>{if(strokes.length)undone.push(strokes.pop());repaint()};$('redo').onclick=()=>{if(undone.length)strokes.push(undone.pop());repaint()};$('clear').onclick=()=>{strokes=[];undone=[];repaint()};$('color').value=color;$('color').oninput=e=>{color=e.target.value;save()};$('size').value=size;$('sizeValue').textContent=size;$('size').oninput=e=>{size=Number(e.target.value);$('sizeValue').textContent=size;save()};function exportPNG(){const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='brush-lab.png';a.click()}$('export').onclick=exportPNG;$('exportMobile').onclick=exportPNG;
function toggleTheme(){document.body.classList.toggle('dark');save()}function toggleLang(){lang=lang==='zh'?'en':'zh';drawCategories();drawItems();renderPresets();save()}$('theme').onclick=toggleTheme;$('mobileTheme').onclick=toggleTheme;$('lang').onclick=toggleLang;$('mobileLang').onclick=toggleLang;$('search').oninput=searchAll;
function renderPresets(){const box=$('presets');box.replaceChildren();presets.forEach(p=>{const b=document.createElement('button');b.className='preset';b.textContent=p[2]+' '+p[lang==='zh'?0:1];b.onclick=()=>{settings={...defaults,...p[3]};category=0;opened=-1;drawCategories();drawItems();$('activeSetting').textContent=txt('已套用：','Applied: ')+p[lang==='zh'?0:1];save()};box.append(b)})}drawCategories();drawItems();renderPresets();requestAnimationFrame(resize);window.addEventListener('resize',resize);if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(canvas);
</script></body></html>
