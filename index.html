const lessons={
spacing:[
['作用與原理','筆畫不是一條連續的實心線，而是筆尖形狀沿路徑重複蓋印。間距決定相鄰蓋印相隔多遠，通常以筆尖尺寸為基準；同一百分比下，筆尖越大，實際間隔也越大。'],
['調低／調高','調低：蓋印緊密重疊，看起來較連續；調高：逐漸看見一顆顆筆尖。圓形筆尖在 100% 附近仍可能接觸，不一定出現大片空白。透明筆尖重疊也會改變濃淡。'],
['繪畫用途與練習','勾線先試 2–10%；珠串、縫線或裝飾筆刷先試 60–100%。固定大小，慢慢畫一條直線，再快速畫一條；間距是按距離排列，不應只因手速或觸控事件變多就忽密忽疏。'],
['常見問題','間距不等於筆刷大小，也不等於透明度。想要線條平滑，先降低間距；手震造成的歪曲則要看「穩定化」。本網站的百分比是教學近似值，並非 Procreate 引擎的逐像素重現。']],
spacingJitter:[
['作用與原理','在基礎間距上加入隨機變化，每一對相鄰蓋印的距離可能不同。它改變沿路徑的疏密，不會主動把筆尖移到路徑左右兩側。'],
['調低／調高','0%：規律排列；調高：緊密與稀疏交錯。若基礎間距非常小，蓋印互相覆蓋，變化可能看不明顯。先把間距設為 70–90% 再觀察。'],
['繪畫用途與練習','適合砂礫、種子與不規則裝飾。先畫間距固定的珠串，再提高抖動比較節奏；精準縫線與規則點線通常保持低值。'],
['常見問題','間距抖動不是「橫向抖動」，也不是「線性抖動」。前者隨機選擇下一次蓋印的間隔；線性抖動則把既定位置沿前進方向移開，視覺上都可能變得疏密不均。']],
lateral:[
['作用與原理','把每次蓋印移到路徑左右兩側，偏移方向垂直於當地筆畫前進方向。畫水平線時偏移主要朝上下；畫垂直線時偏移主要朝左右。'],
['調低／調高','0%：筆尖中心留在路徑上；調高：中心散到兩側，筆觸覆蓋範圍變寬。這是移動位置，不是放大每個筆尖。'],
['繪畫用途與練習','用於草叢、星塵、噴濺與樹葉。先設間距 60%，畫水平和垂直兩條線，再提高橫向抖動；兩條線都應朝各自的兩側散開。'],
['常見問題','「橫向」是相對於筆畫方向，不是固定的螢幕 X 軸。形狀中的「散佈」通常改變筆尖旋轉角度，並不等於把中心位置散開。']],
linear:[
['作用與原理','將蓋印中心沿筆畫前進方向前後移動。它保留路徑大致寬度，讓原本均勻的排列出現重疊或空隙。'],
['調低／調高','0%：維持基礎位置；調高：前後偏移更大，排列節奏更不規則。與橫向抖動一起使用時，會同時向前後與兩側散開。'],
['繪畫用途與練習','用於自然顆粒、粗糙線條和斷續紋理。先把橫向抖動歸零、間距設為 80%，畫直線，再增加線性抖動，觀察中心仍大致落在同一條路徑上。'],
['常見問題','線性抖動不代表線條變直，也不是穩定化。它與間距抖動都會改變疏密，但控制的是位置偏移與間隔隨機化兩個不同步驟。']],
falloff:[
['作用與原理','讓單次筆畫隨著繪製距離逐漸淡出，像筆尖上的顏料慢慢耗盡；重新起筆會重新開始。這裡以透明度隨距離降低示意，不模擬完整顏料與紋理互動。'],
['調低／調高','0%：沒有距離造成的退減；調高：在較短距離內淡出。淡到看不見後，繼續同一筆不會補回顏色，抬筆再畫才重新出現。'],
['繪畫用途與練習','適合短促乾筆、鬍鬚或帶耗墨感的裝飾。先試 30%，一筆畫長線，再分成三次起筆；比較每一筆是否重新由濃變淡。想維持長線均勻就降低退減。'],
['常見問題','退減主要看筆畫走過的距離，不是停留時間。它不同於錐化（起終點形狀）及濕混合的顏料量（顏料攜帶與混合）；本模擬的淡出距離不等同 Procreate 的數值標定。']]
};
const englishLessons={
spacing:['Strokes consist of repeated tip stamps. Spacing sets their distance relative to tip size. Larger tips therefore have larger physical gaps at the same percentage.','Low values overlap into a continuous line; high values reveal individual stamps. At 100%, round stamps can still touch. Overlap also changes translucent paint density.','Try 2–10% for outlines and 60–100% for beads or decoration. Draw slowly and quickly: spacing should follow distance, rather than the number of pointer events.','Spacing is neither size nor opacity. Lower it for visible stamp gaps; use Stabilization for a shaky path. The numerical simulation is approximate.'],
spacingJitter:['Randomizes the interval between consecutive stamps around the base spacing, without deliberately moving stamps to the sides.','0% is regular. Higher values mix dense and sparse intervals. Set base spacing to 70–90% first so overlap does not hide the effect.','Use for gravel, seeds and irregular decoration. Compare a regular bead line with a randomized line; keep this low for precise stitching.','Spacing jitter changes the next interval. Linear jitter shifts existing positions along the direction of travel. Both can look uneven but act at different stages.'],
lateral:['Offsets stamp centers perpendicular to the local direction of travel: above/below a horizontal path and left/right of a vertical path.','0% keeps centers on the path. Higher values widen their distribution without enlarging individual stamps.','Try 60% spacing for grass, stars or foliage. Draw horizontal and vertical paths and observe the sideways spread relative to each path.','Lateral does not mean the screen X axis. Shape Scatter rotates tips, whereas lateral jitter moves their centers.'],
linear:['Moves stamp centers forward or backward along the local path direction, creating overlaps and gaps without intentionally widening the path.','0% preserves base positions. Higher values increase displacement. Combine with lateral jitter to spread stamps in both directions.','For natural particles and broken textures, first set lateral jitter to zero and spacing to 80%, then increase linear jitter on a straight stroke.','Linear jitter does not straighten a line. Unlike spacing jitter, it offsets a stamp position rather than selecting the next interval.'],
falloff:['Fades a stroke as drawing distance increases, resembling a dwindling paint supply. Lifting and starting a new stroke restarts it. This preview approximates the effect with opacity.','0% has no distance fade. Higher values fade over a shorter distance. Once invisible, continuing the same stroke does not refill it.','Try 30% for dry marks or short decorative strokes. Compare one long stroke against three separate strokes; every new stroke starts dark again.','Fall off follows distance rather than elapsed time. Taper controls stroke ends; Wet Mix Charge controls paint load and mixing. Preview distances are not calibrated to Procreate.']};

 const lesson=lessons[key];if(!lesson)return;
 lesson.forEach(([title,content],i)=>{const h=document.createElement('h3'),p=document.createElement('p');h.textContent=txt(title,['How it works','Lower / higher','When to use it','Common confusion'][i]);p.textContent=txt(content,englishLessons[key][i]);body.append(h,p);if(i===1)body.append(comparison(key))});
 const source=document.createElement('p');source.className='sourceNote';source.append(document.createTextNode(txt('參考：Procreate 筆刷工作室「筆畫路徑」。以 5.4.14 繁體中文介面為學習目標；圖解與試畫是概念示意。','Reference: Procreate Brush Studio · Stroke Path. Preview values are illustrative. ')));const a=document.createElement('a');a.href='https://help.procreate.com/procreate/handbook/brushes/brush-studio-settings';a.textContent=txt('官方筆刷設定手冊','Official brush settings handbook');a.target='_blank';a.rel='noopener noreferrer';source.append(a);body.append(source);
}

 const figure=document.createElement('figure');figure.className='comparison';const caption=document.createElement('figcaption');caption.textContent=txt('低值／高值比較 · 其他設定固定（圓點為筆尖中心）','Low / high comparison · other settings fixed');figure.append(caption);
 const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 320 130');svg.setAttribute('role','img');svg.setAttribute('aria-label',txt('上排低值、下排高值；虛線是繪畫路徑','Top: low; bottom: high. Dashed lines show the drawing path.'));
 const random=randomizer(42);for(let row=0;row<2;row++){
  const y=35+row*60,path=document.createElementNS(ns,'path');path.setAttribute('d',`M 15 ${y} H 305`);path.setAttribute('stroke','#9ca99d');path.setAttribute('stroke-dasharray','4 4');svg.append(path);
  let x=20;while(x<302){let cx=x,cy=y,alpha=.8;if(row&&key==='lateral')cy+=(random()-.5)*42;if(row&&key==='linear')cx+=(random()-.5)*28;if(row&&key==='falloff')alpha=Math.max(0,1-(x-20)/230);
   const dot=document.createElementNS(ns,'circle');dot.setAttribute('cx',cx);dot.setAttribute('cy',cy);dot.setAttribute('r','6');dot.setAttribute('fill','#567e66');dot.setAttribute('opacity',alpha);svg.append(dot);
   x+=key==='spacing'?(row?24:5):key==='spacingJitter'&&row?8+random()*30:18;
  }
 }
 figure.append(svg);const labels=document.createElement('div');labels.className='legend';labels.textContent=txt('上：低值／零抖動　　下：高值','Top: low / no jitter · Bottom: high');figure.append(labels);return figure;
}

  "4:鏡像重疊": [

  "4:金字塔混合": [
    "用不同尺度的細節一起處理圖塊交界，讓粗大亮暗與細小顆粒都較容易銜接。適合複雜自然來源。",
    "關閉時使用其他邊緣混合方式，規則圖案可能較好控制。",
    "開啟後有機會減少自然紋理的接縫，但細節外觀也可能改變。",

  "5:渲染模式": [
    "決定顏料如何累積、覆蓋和混合。同一個筆尖與顏色，在偏薄塗與偏厚重混合的模式下，疊筆的結果可以很不同。",
    "淺釉光等模式適合先觀察薄塗與疊色，感覺較輕。",
    "均勻混合、強烈混合較適合搭配濕混合觀察顏料相互作用；六種模式是選擇，不是線性強度。",
    "畫兩條交叉線，再在同一區反覆塗三次；比較一筆內重疊與抬筆後疊加，找出喜歡的累色方式。",
    "「顏色深」可能來自渲染、流或透明度；固定其他設定再換模式，不要同時全調。"

  "5:流": [
    "控制筆刷在繪畫過程中送到畫布上的顏色與紋理量。可以想像同一支噴筆，出料少或出料多。",
    "單次經過留下較少顏色，通常需要多次累積。",
    "出料較強，筆觸較容易覆蓋底色；結果仍受渲染模式影響。",
    "保持同一顏色，低流量畫一次再畫三次；比較是否能慢慢堆色。適合柔和上色與漸層。",
    "流與整筆透明度不完全相同，尤其在同一筆反覆經過時，累積方式也受到渲染影響。"

  "5:濕邊緣": [
    "讓筆觸邊界有顏料滲開的柔化感，像水分接觸紙纖維後不再是乾淨硬邊。",
    "邊緣較保持原本的清晰輪廓。",
    "邊界更柔和、有暈開感，細小尖角可能不再清楚。",

    "濕邊緣不等於燃燒邊緣：前者著重滲開，後者著重邊緣與重疊處的加深效果。"

  "5:燃燒邊緣": [
    "讓顏料邊緣或筆觸相交處產生較強的色彩加深關係，像積色留在交界。不是把筆觸真的燒焦。",
    "邊緣加深較少，交疊較單純。",
    "邊緣與重疊的深色感更明顯，太高可能出現髒邊。",
    "畫兩個交叉的半透明色塊，觀察交界和外緣；適合想要積色感的水彩。",
    "若整筆都變暗，還要檢查整體混色模式；這項重點是邊緣效果。"

  "5:燃燒邊緣模式": [
    "指定邊緣效果怎麼與既有顏色合成。它決定邊緣變暗或產生色偏的計算方式，而不是邊緣有多寬。",
    "選不同模式會改變邊緣與底色的互動，沒有單一低值。",

  "5:混色模式": [
    "決定整個筆觸如何與畫布既有顏色合成。像同樣一層顏料，可以一般覆蓋，也可以著重加深或提亮。",
    "例如一般模式較直觀地覆蓋或混合。",
    "加深、提亮等模式會依底色產生不同結果；這是類型，不是數值高低。",
    "畫一條線同時跨過白底、灰底、彩色底；用同一筆比較三個區域，才能看懂模式在做什麼。",
    "筆刷混色與圖層混色是兩個層級；同時使用時效果可能相互疊加。"

  "5:亮度混合": [
    "讓混合著重明暗數值，而不是只依一般色彩關係處理。可以用來觀察保留色彩與改變亮暗之間的差別。",
    "關閉使用原本的混合方式。",
    "開啟改以亮度關係混合，明暗與色彩結果可能不同。",

  "5:阿爾法臨界值": [
    "把筆觸像素依透明程度分成「保留為全不透明」與「捨去為全透明」兩邊，不再保留中間半透明。阿爾法就是透明度資訊。",
    "關閉時保留柔邊與半透明過渡。",

  "5:臨界值量": [
    "在開啟阿爾法臨界值後，設定一個像素至少要多不透明才能留下。像用門檻篩選較實的部分。",

    "用同一柔邊印章比較低、中、高門檻，看輪廓從膨脹到縮小；想做硬邊時逐步調整。",
    "只有啟用阿爾法臨界值後才有這種篩選作用。門檻太高導致沒畫出來，不等於筆刷壞掉。"

  "5:經典正常結合模式": [
    "讓雙筆刷在正常結合模式下使用較舊版本的混合行為。主要是為了維持舊雙筆刷的外觀。",

    "這不是所有筆刷的「正常混色」總開關，也不代表經典模式畫質更好。"

  "6:稀釋": [
    "改變顏料中水分的感覺，讓筆觸更像濃顏料或加水後的薄色。它與顏料量、攻擊等設定共同決定濕混合結果。",

  "6:顏料量": [

  "6:攻擊": [

  "6:顏料取用": [

  "6:級數": [

  "6:模糊": [

  "6:模糊抖動": [

  "6:濕度抖動": [

  "8:速度：尺寸": [
    "用畫線快慢改變筆尖大小，讓沒有筆壓的手指也能畫出速度帶來的粗細變化。比較時要保持筆刷基本尺寸不變。",

  "8:速度：透明度": [

  "8:速度：間距": [

  "8:抖動：尺寸": [

  "8:抖動：透明度": [

  "9:壓力曲線": [

  "9:傾斜曲線": [

  "9:傾斜：漸變": [

  "9:傾斜：尺寸壓縮": [

    "關閉時，尺寸變化可能連帶讓紋理顆粒變大。",
